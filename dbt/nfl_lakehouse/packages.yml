# packages.yml
# ------------
# Declares external dbt packages used across the project.
#
# dbt_utils: utility macros from dbt Labs. Used for:
#   - generate_surrogate_key() — hashes composite keys into a single unique ID (ADR-015)
#
# After adding or changing packages, run: dbt deps

packages:
  - package: dbt-labs/dbt_utils
    version: 1.3.0 # pinned — never use unpinned versions in production