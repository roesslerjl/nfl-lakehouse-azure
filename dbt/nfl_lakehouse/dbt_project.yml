
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'nfl_lakehouse'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'nfl_lakehouse'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Model configuration
# --------------------------------------------------------------------------
# Sets default materializations per layer. Individual models can override
# these defaults using {{ config(materialized='...') }} in the model file.
#
# staging:      view  — thin translation layer, no storage cost needed
# intermediate: view  — assembly layer, kept as view for debuggability
# marts:        table — primary query surface for dashboard and ML (ADR-014)
#
# Tags allow selective runs: e.g. `dbt run --select tag:marts`
models:
  nfl_lakehouse:
    staging:
      +materialized: view
      +tags: ["staging"]
    intermediate:
      +materialized: view
      +tags: ["intermediate"]
    marts:
      +materialized: table
      +tags: ["marts"]
